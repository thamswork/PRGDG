<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GDG Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#1a1f2e;
      --canvas:#f7f5f0;--surface:#fff;
      --border:#e4e1db;--border-soft:#f0eee9;
      --text:#1a1f2e;--text-2:#5a5750;--text-3:#9a9690;
      --green:#166534;--green-bg:#dcfce7;
      --amber:#92570a;--amber-bg:#fef3c7;
      --red:#b91c1c;--red-bg:#fee2e2;
      --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;-webkit-font-smoothing:antialiased}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--canvas);color:var(--text);display:flex;flex-direction:column;min-height:100vh}

    /* NAV — matches main app */
    .nav{background:var(--navy);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25);flex-shrink:0}
    .nav-l{display:flex;align-items:center;gap:10px}
    .nav-mark{font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px}
    .nav-tag{font-size:9px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .nav-status{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.5px}

    /* STATES */
    .state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
    .state.hidden{display:none}

    /* CAMERA SECTION */
    .scanner-wrap{position:relative;width:100%;max-width:320px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.15)}
    #videoEl{width:100%;display:block;background:var(--navy);aspect-ratio:1}
    .scan-frame{position:absolute;inset:0;pointer-events:none}
    .scan-frame::before,.scan-frame::after{content:'';position:absolute;width:32px;height:32px;border-color:var(--navy);border-style:solid}
    .scan-frame::before{top:10px;left:10px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
    .scan-frame::after{bottom:10px;right:10px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
    .scan-line{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,var(--navy),transparent);animation:scanline 2s ease-in-out infinite}
    @keyframes scanline{0%,100%{top:16px;opacity:0}10%{opacity:1}90%{opacity:1}50%{top:calc(100% - 16px)}}
    .scan-hint-text{margin-top:12px;font-size:11px;color:var(--text-3);font-weight:600}

    /* DIVIDER */
    .or-divider{display:flex;align-items:center;gap:10px;margin:20px 0;width:100%;max-width:300px}
    .or-divider span{color:var(--text-3);font-size:10px;font-weight:600;white-space:nowrap}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* MANUAL INPUT */
    .manual-wrap{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
    .manual-input{width:100%;height:44px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;padding:0 14px;outline:none;letter-spacing:.5px;transition:.2s}
    .manual-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,31,46,.08)}
    .manual-input::placeholder{color:var(--text-3);font-weight:400;letter-spacing:0}
    .btn-lookup{height:44px;width:100%;background:var(--navy);border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:.15s}
    .btn-lookup:active{transform:scale(.98)}

    /* RESULT CARD — matches .card from main app */
    .result-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:360px;overflow:hidden;box-shadow:var(--sh)}
    .result-header{padding:18px 20px 14px;border-bottom:1px solid var(--border-soft)}
    .result-sys{font-size:8px;font-weight:700;letter-spacing:3px;color:var(--text-3);text-transform:uppercase;margin-bottom:8px}
    .result-name{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.3px;line-height:1.2}
    .result-brand{font-size:9px;color:var(--text-3);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
    .result-body{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
    .result-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border-soft)}
    .result-row:last-child{border-bottom:none}
    .result-lbl{color:var(--text-3);font-weight:600;font-size:11px}
    .result-val{color:var(--navy);font-weight:700}
    .status-badge{padding:4px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
    .status-badge.active{background:var(--green-bg);color:var(--green)}
    .status-badge.redeemed{background:var(--red-bg);color:var(--red)}
    .status-badge.inactive{background:var(--border-soft);color:var(--text-3)}
    .result-footer{padding:14px 20px 18px;display:flex;flex-direction:column;gap:8px}
    .btn-confirm{height:48px;background:var(--navy);border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:.15s}
    .btn-confirm:active{transform:scale(.98)}
    .btn-confirm:disabled{opacity:.35;cursor:not-allowed}
    .btn-cancel{height:40px;background:transparent;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:.15s}
    .btn-cancel:hover{border-color:var(--text-2)}

    /* SUCCESS STATE */
    .state-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
    .icon-success{background:var(--green-bg);border:2px solid rgba(22,101,52,.2)}
    .icon-warn{background:var(--red-bg);border:2px solid rgba(185,28,28,.2)}
    .icon-info{background:var(--amber-bg);border:2px solid rgba(146,87,10,.2)}
    .state-title{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px}
    .state-title.green{color:var(--green)}
    .state-title.red{color:var(--red)}
    .state-title.amber{color:var(--amber)}
    .state-sub{font-size:12px;color:var(--text-3);line-height:1.6;max-width:260px}
    .btn-secondary{height:42px;background:transparent;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;width:100%;max-width:260px;margin-top:14px;transition:.15s}
    .btn-secondary:hover{border-color:var(--navy);color:var(--navy)}

    /* SPINNER */
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-l">
    <div class="nav-mark">GDG</div>
    <div class="nav-tag">Scanner</div>
  </div>
  <div class="nav-status" id="navStatus">Ready</div>
</nav>

<!-- STATE: SCAN -->
<div class="state" id="stScan">
  <div class="scanner-wrap">
    <video id="videoEl" playsinline autoplay muted></video>
    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>
  </div>
  <div class="scan-hint-text">Point camera at customer QR code</div>

  <div class="or-divider"><span>or enter ID manually</span></div>

  <div class="manual-wrap">
    <input type="text" id="manualId" class="manual-input" placeholder="KOL-XXXXXXXX" autocomplete="off" spellcheck="false">
    <button class="btn-lookup" onclick="lookupManual()">Look Up Voucher</button>
  </div>
</div>

<!-- STATE: LOADING -->
<div class="state hidden" id="stLoading">
  <div class="spinner"></div>
  <div style="font-size:12px;font-weight:600;color:var(--text-3)">Verifying voucher...</div>
</div>

<!-- STATE: CONFIRM -->
<div class="state hidden" id="stConfirm">
  <div class="result-card">
    <div class="result-header">
      <div class="result-sys">GDG Seeding System</div>
      <div class="result-name" id="confName">—</div>
      <div class="result-brand" id="confBrand">—</div>
    </div>
    <div class="result-body">
      <div class="result-row">
        <span class="result-lbl">Status</span>
        <span class="status-badge active" id="confStatusBadge">Active</span>
      </div>
      <div class="result-row">
        <span class="result-lbl">Visit Date</span>
        <span class="result-val" id="confDate">—</span>
      </div>
      <div class="result-row">
        <span class="result-lbl">Type</span>
        <span class="result-val" id="confType">Store Invite</span>
      </div>
      <div class="result-row">
        <span class="result-lbl">Voucher ID</span>
        <span class="result-val" id="confId" style="font-family:monospace;font-size:10px;color:var(--text-3)">—</span>
      </div>
    </div>
    <div class="result-footer">
      <button class="btn-confirm" id="btnConfirm" onclick="confirmRedeem()">Confirm Redemption</button>
      <button class="btn-cancel" onclick="resetScanner()">Cancel</button>
    </div>
  </div>
</div>

<!-- STATE: SUCCESS -->
<div class="state hidden" id="stSuccess">
  <div class="state-icon icon-success">&#10003;</div>
  <div class="state-title green">Redeemed</div>
  <div class="state-sub" id="succName">—</div>
  <div class="state-sub" id="succTime" style="margin-top:4px;font-size:10px">—</div>
  <button class="btn-secondary" onclick="resetScanner()">Scan Next Customer</button>
</div>

<!-- STATE: ALREADY REDEEMED -->
<div class="state hidden" id="stRedeemed">
  <div class="state-icon icon-warn">&#x26D4;</div>
  <div class="state-title red">Already Redeemed</div>
  <div class="state-sub" id="redeemedMsg">This voucher has already been used.</div>
  <button class="btn-secondary" onclick="resetScanner()">Back to Scanner</button>
</div>

<!-- STATE: ERROR -->
<div class="state hidden" id="stError">
  <div class="state-icon icon-info">&#x26A0;</div>
  <div class="state-title amber">Error</div>
  <div class="state-sub" id="errMsg">Something went wrong.</div>
  <button class="btn-secondary" onclick="resetScanner()">Try Again</button>
</div>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbwmoyRMwnnwhGEzfWnwUNvqcApxB2eg90FrTAoJaU4rj1PPOyC4aPF09EkfO4dJZqLp8A/exec';

let stream      = null;
let scanning    = false;
let currentId   = '';
let pendingData = null;

const STATES = ['stScan','stLoading','stConfirm','stSuccess','stRedeemed','stError'];
function showState(id){STATES.forEach(s=>{document.getElementById(s).classList.toggle('hidden',s!==id);});}

// ── CAMERA ────────────────────────────────────────────────────────────────
async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    const vid=document.getElementById('videoEl');
    vid.srcObject=stream; await vid.play();
    scanning=true; requestAnimationFrame(tick);
    setStatus('Camera active');
  }catch(err){ setStatus('No camera — use manual entry'); }
}

function stopCamera(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}

function setStatus(msg){ document.getElementById('navStatus').textContent=msg; }

// ── QR DECODE ─────────────────────────────────────────────────────────────
let detector=null;
if(window.BarcodeDetector){try{detector=new BarcodeDetector({formats:['qr_code']});}catch(e){}}

async function tick(){
  if(!scanning) return;
  const vid=document.getElementById('videoEl');
  if(vid.readyState>=2&&detector){
    try{
      const codes=await detector.detect(vid);
      if(codes.length>0){
        const id=extractId(codes[0].rawValue);
        if(id&&id!==currentId){ currentId=id; scanning=false; lookup(id); return; }
      }
    }catch(e){}
  }
  requestAnimationFrame(tick);
}

function extractId(raw){
  try{ const u=new URL(raw); const id=u.searchParams.get('id'); if(id&&id.startsWith('KOL-')) return id.trim(); }catch(e){}
  const m=raw.match(/KOL-[A-Z0-9]+/); return m?m[0]:null;
}

// ── MANUAL LOOKUP ─────────────────────────────────────────────────────────
function lookupManual(){
  const val=document.getElementById('manualId').value.trim().toUpperCase();
  if(!val){ document.getElementById('manualId').focus(); return; }
  currentId=val; scanning=false; lookup(val);
}

// ── LOOKUP ────────────────────────────────────────────────────────────────
async function lookup(id){
  showState('stLoading'); setStatus('Checking...');
  try{
    const res=await fetch(GAS+'?action=lookup&id='+encodeURIComponent(id)+'&t='+Date.now(),{redirect:'follow'});
    const data=await res.json();
    if(data.status==='ok'){
      pendingData=data;
      if(data.voucher_status==='Redeemed'){
        document.getElementById('redeemedMsg').textContent='This voucher was already redeemed'+(data.redeemedAt?' on '+data.redeemedAt:'')+'.';
        showState('stRedeemed'); setStatus('Already redeemed');
      }else if(data.voucher_status==='Active'){
        populateConfirm(data); showState('stConfirm'); setStatus('Voucher found');
      }else{
        showError('Voucher is '+data.voucher_status+'. Only active vouchers can be redeemed.');
      }
    }else if(data.status==='not_found'){
      showError('Voucher not found for ID: '+id);
    }else{
      showError(data.message||'Lookup failed');
    }
  }catch(err){ showError('Connection error. Check network and try again.'); }
}

function populateConfirm(data){
  document.getElementById('confName').textContent=data.name||'—';
  document.getElementById('confBrand').textContent=(data.brand||'GDG')+' · '+(data.seedingType||'Store Invite');
  document.getElementById('confDate').textContent=data.date||'—';
  document.getElementById('confType').textContent=data.seedingType||'Store Invite';
  document.getElementById('confId').textContent=data.id||'—';
  const badge=document.getElementById('confStatusBadge');
  badge.textContent=data.voucher_status||'Active';
  badge.className='status-badge '+(data.voucher_status||'active').toLowerCase();
  const btn=document.getElementById('btnConfirm');
  btn.disabled=false; btn.textContent='Confirm Redemption';
}

// ── CONFIRM REDEEM ────────────────────────────────────────────────────────
async function confirmRedeem(){
  if(!currentId) return;
  const btn=document.getElementById('btnConfirm');
  btn.disabled=true; btn.textContent='Redeeming...'; setStatus('Processing...');
  try{
    const res=await fetch(GAS+'?action=redeem&id='+encodeURIComponent(currentId)+'&t='+Date.now(),{redirect:'follow'});
    const data=await res.json();
    if(data.status==='redeemed'){
      document.getElementById('succName').textContent=(pendingData&&pendingData.name)||data.name||'—';
      document.getElementById('succTime').textContent='Redeemed at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      showState('stSuccess'); setStatus('Redeemed ✓');
    }else if(data.status==='already_redeemed'){
      document.getElementById('redeemedMsg').textContent='This voucher was already redeemed'+(data.redeemedAt?' on '+data.redeemedAt:'')+'.';
      showState('stRedeemed'); setStatus('Already redeemed');
    }else{
      showError(data.message||'Redemption failed');
      btn.disabled=false; btn.textContent='Confirm Redemption';
    }
  }catch(err){
    showError('Connection error during redemption. Please try again.');
    btn.disabled=false; btn.textContent='Confirm Redemption';
  }
}

function showError(msg){ document.getElementById('errMsg').textContent=msg; showState('stError'); setStatus('Error'); }

// ── RESET ─────────────────────────────────────────────────────────────────
function resetScanner(){
  currentId=''; pendingData=null;
  document.getElementById('manualId').value='';
  showState('stScan'); setStatus('Ready');
  if(stream){ scanning=true; requestAnimationFrame(tick); }
}

// ── BOOT ──────────────────────────────────────────────────────────────────
(function(){
  const p=new URLSearchParams(window.location.search);
  const id=(p.get('id')||'').trim();
  if(id){ currentId=id; lookup(id); return; }
  startCamera();
})();

document.getElementById('manualId').addEventListener('keydown',function(e){ if(e.key==='Enter') lookupManual(); });
</script>
</body>
</html>
